[workspace]
members = ["crates/maulink-core", "src-tauri"]
default-members = ["crates/maulink-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
dns-lookup = "4.0.1"
idna = "1.1"
keyring-core = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.38", features = ["backup", "bundled"] }
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.23"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
ts-rs = { version = "12.0", features = ["serde-compat", "uuid-impl"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
zeroize = "1.8"

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MauLink · Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-app:#F6F7F9; --bg-surface:#FFFFFF; --bg-subtle:#F8F9FB; --bg-hover:#F0F2F5;
  --bg-selected:#EEF0FF; --bg-elevated:#FFFFFF; --border:#E5E7EB; --border-strong:#D1D5DB;
  --text-primary:#171A21; --text-secondary:#667085; --text-tertiary:#98A2B3;
  --accent:#5B5CE2; --accent-hover:#4D4ED0; --accent-soft:#EEEEFF;
  --success:#22A06B; --warning:#D99000; --danger:#D64545; --info:#4F7DED;
  --success-soft:#E7F6EF; --warning-soft:#FBF1DC; --danger-soft:#FBEAEA;
  --terminal-bg:#FBFBFD; --terminal-text:#171A21; --terminal-dim:#667085;
  --overlay:rgba(23,26,33,.6); --shadow:0 12px 40px rgba(16,24,40,.16), 0 2px 8px rgba(16,24,40,.08);
  --radius:10px;
}
html[data-theme="dark"]{
  --bg-app:#0D0F12; --bg-surface:#12151A; --bg-subtle:#171A20; --bg-hover:#20242B;
  --bg-selected:#252748; --bg-elevated:#1B1F27; --border:#292E36; --border-strong:#343A46;
  --text-primary:#F3F4F6; --text-secondary:#A7AFBC; --text-tertiary:#788291;
  --accent:#7C7EF2; --accent-hover:#8C8EF7; --accent-soft:#242645;
  --success:#2FB37C; --warning:#E0A32B; --danger:#E15858; --info:#6A92F0;
  --success-soft:#12271E; --warning-soft:#2A2110; --danger-soft:#2C1517;
  --terminal-bg:#0A0C10; --terminal-text:#E6E8EC; --terminal-dim:#8A93A1;
  --overlay:rgba(0,0,0,.65); --shadow:0 16px 48px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg-app);color:var(--text-primary);-webkit-font-smoothing:antialiased;font-size:13px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.app{display:flex;flex-direction:column;height:100vh;min-height:560px;min-width:960px;background:var(--bg-app);color:var(--text-primary)}
svg{display:block}
.ic{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- toolbar ---------- */
.toolbar{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg-subtle);border-bottom:1px solid var(--border);-webkit-app-region:drag}
.traffic{display:flex;gap:8px;margin-right:6px}
.traffic i{width:12px;height:12px;border-radius:50%;display:block}
.traffic i.r{background:#FF5F57}.traffic i.y{background:#FEBC2E}.traffic i.g{background:#28C840}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.brand .mark{width:20px;height:20px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.spacer{flex:1}
.searchbox{display:flex;align-items:center;gap:8px;width:300px;height:32px;padding:0 10px;border-radius:8px;background:var(--bg-surface);border:1px solid var(--border);color:var(--text-secondary);cursor:text;transition:border-color .15s,box-shadow .15s}
.searchbox:hover{border-color:var(--border-strong)}
.searchbox .kbd{margin-left:auto;font-size:10.5px;color:var(--text-tertiary);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-family:"JetBrains Mono",monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 13px;border-radius:8px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,opacity .15s}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-hover)}
.btn.sec{background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border)}
.btn.sec:hover{background:var(--bg-hover);border-color:var(--border-strong)}
.btn.ghost{background:transparent;color:var(--text-secondary)}
.btn.ghost:hover{background:var(--bg-hover);color:var(--text-primary)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger:hover{filter:brightness(1.08)}
.btn.sm{height:28px;padding:0 11px;font-size:12px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--text-secondary);transition:background .15s,color .15s}
.iconbtn:hover{background:var(--bg-hover);color:var(--text-primary)}
.iconbtn.on{background:var(--accent-soft);color:var(--accent)}
/* ---------- body ---------- */
.body{flex:1;display:flex;min-height:0}
.sidebar{width:236px;flex:none;background:var(--bg-subtle);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.side-top{padding:10px 10px 6px}
.side-search{display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;border-radius:7px;background:var(--bg-surface);border:1px solid var(--border);color:var(--text-tertiary)}
.side-search input{flex:1;border:none;background:none;outline:none;font-size:12.5px;color:var(--text-primary);min-width:0}
.side-search input::placeholder{color:var(--text-tertiary)}
.side-scroll{flex:1;overflow-y:auto;padding:4px 8px 10px}
.grp{margin-top:12px}
.grp-head{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-tertiary)}
.grp-head .cnt{font-weight:500;color:var(--text-tertiary)}
.grp-head .add{margin-left:auto;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--text-tertiary);opacity:0;transition:opacity .15s}
.grp:hover .grp-head .add{opacity:1}
.grp-head .add:hover{background:var(--bg-hover);color:var(--text-primary)}
.srv{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;position:relative;transition:background .12s}
.srv:hover{background:var(--bg-hover)}
.srv.sel{background:var(--bg-selected)}
.srv .dot{width:7px;height:7px;border-radius:50%;background:var(--border-strong);flex:none}
.srv .dot.connected{background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 18%,transparent)}
.srv .dot.connecting{background:var(--warning);animation:pulse 1s infinite}
.srv .dot.failed{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}
.srv .meta{min-width:0;flex:1}
.srv .nm{font-size:12.5px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv .hs{font-size:11px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:"JetBrains Mono",monospace}
.srv.sel .nm{color:var(--accent)}
.side-foot{padding:10px;border-top:1px solid var(--border)}
.main{flex:1;display:flex;min-width:0;min-height:0;background:var(--bg-surface)}
.workspace{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
/* ---------- empty / home ---------- */
.center-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center}
.empty-ico{width:64px;height:64px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:22px}
.center-view h1{margin:0 0 10px;font-size:20px;font-weight:600;letter-spacing:-.01em}
.center-view p{margin:0 0 26px;max-width:440px;font-size:13.5px;line-height:1.7;color:var(--text-secondary);white-space:pre-line}
.learn{margin-top:20px;font-size:12.5px;color:var(--accent);text-decoration:none;cursor:pointer}
.learn:hover{text-decoration:underline}
.demo-link{margin-top:8px;font-size:12px;color:var(--text-tertiary);cursor:pointer}
.demo-link:hover{color:var(--text-secondary);text-decoration:underline}
/* ---------- terminal view ---------- */
.ws-head{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border)}
.ws-head .host{display:flex;align-items:center;gap:8px;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text-secondary)}
.status-pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600}
.status-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.status-pill.connected{background:var(--success-soft);color:var(--success)}
.status-pill.connecting{background:var(--warning-soft);color:var(--warning)}
.status-pill.disconnected{background:var(--bg-hover);color:var(--text-secondary)}
.status-pill.failed{background:var(--danger-soft);color:var(--danger)}
.tabs{display:flex;align-items:center;gap:2px;padding:0 10px;height:38px;flex:none;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{display:flex;align-items:center;gap:7px;height:29px;padding:0 11px;border-radius:7px;font-size:12px;color:var(--text-secondary);white-space:nowrap}
.tab:hover{background:var(--bg-hover)}
.tab.on{background:var(--bg-selected);color:var(--accent);font-weight:600}
.tab .tab-x{width:17px;height:17px;border-radius:5px;display:grid;place-items:center;color:var(--text-tertiary);margin-left:1px;flex:none;opacity:0;transition:opacity .15s ease,background .15s ease,color .15s ease,transform .15s ease}
.tab:hover .tab-x,.tab.on .tab-x{opacity:1}
.tab .tab-x:hover{background:var(--danger-soft);color:var(--danger);transform:scale(1.08)}
.term-wrap{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--terminal-bg)}
.term{flex:1;overflow-y:auto;padding:14px 18px;font-family:"JetBrains Mono",monospace;font-size:12.5px;line-height:1.72;color:var(--terminal-text)}
.term .ln{white-space:pre-wrap;word-break:break-word}
.term .ln.dim{color:var(--terminal-dim)}
.term .ln.cmd .sym{color:var(--accent);font-weight:600}
.term .ln.cmd .pth{color:var(--accent)}
.term .ln.ok{color:var(--success)}
.term .ln.warn{color:var(--warning)}
.term .ln.err{color:var(--danger)}
.term .ln.head{color:var(--text-secondary)}
.term-input{display:flex;align-items:center;gap:8px;padding:0 18px 16px;font-family:"JetBrains Mono",monospace;font-size:12.5px}
.term-input .cursor{width:8px;height:16px;background:var(--terminal-text);opacity:.8;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.term-input input{flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:inherit;color:inherit;caret-color:var(--accent)}
.tp-user,.tp-sep{color:var(--text-tertiary)}
.tp-path{color:var(--accent)}
.tp-sym{color:var(--accent);margin-right:8px}
.term .tp-line{display:flex;align-items:center}
.term .tp-line input{flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:inherit;color:inherit;caret-color:var(--accent);padding:0}
/* ---------- quick monitor ---------- */
.quickmon{width:268px;flex:none;background:var(--bg-subtle);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.qm-head{padding:14px 14px 10px;display:flex;align-items:center;justify-content:space-between}
.qm-head h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--text-secondary)}
.qm{padding:12px 14px;border-bottom:1px solid var(--border)}
.qm .row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.qm .lbl{font-size:11.5px;color:var(--text-secondary)}
.qm .val{font-size:16px;font-weight:600;font-family:"JetBrains Mono",monospace}
.qm .val small{font-size:11px;font-weight:400;color:var(--text-tertiary)}
.spark{display:flex;align-items:flex-end;gap:2px;height:34px}
.spark i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;opacity:.85;transition:height .5s ease}
.spark.up i{background:var(--success)}
.qm-foot{padding:10px 14px;font-size:11px;color:var(--text-tertiary);display:flex;justify-content:space-between;align-items:center}
.qp-panel{display:flex;flex-direction:column;flex:1;min-height:0;border-top:1px solid var(--border)}
.qp-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.qp-head h3{margin:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--text-secondary)}
.qp-ctl{display:flex;align-items:center;gap:6px;padding:0 14px 8px}
.qp-view,.qp-type{flex:1;min-width:0}
.qp-panel .qp-view button,.qp-panel .qp-type button{flex:1;min-width:0;padding:0 3px;font-size:10.5px;font-weight:500;white-space:nowrap}
.qp-order{width:26px;height:26px;flex:none}
.qp-list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 8px}
.qp-row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;font-size:12px}
.qp-row:hover{background:var(--bg-hover)}
.qp-name{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px}
.qp-pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qp-pid{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--text-tertiary);flex:none}
.qp-bar{width:44px;height:4px;border-radius:999px;background:var(--bg-hover);overflow:hidden;flex:none}
.qp-bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s ease}
.qp-val{width:64px;text-align:right;font-family:"JetBrains Mono",monospace;font-size:11.5px;flex:none}
/* ---------- monitor view ---------- */
.page{flex:1;overflow-y:auto;padding:22px 24px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.page-head h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.page-head .sub{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text-secondary)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card .clbl{font-size:11.5px;color:var(--text-secondary);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card .cval{font-size:26px;font-weight:600;letter-spacing:-.02em;font-family:"JetBrains Mono",monospace}
.card .cval small{font-size:13px;font-weight:400;color:var(--text-tertiary);margin-left:3px}
.card .csub{margin-top:6px;font-size:11.5px;color:var(--text-tertiary)}
.mini-bar{height:4px;border-radius:999px;background:var(--bg-hover);overflow:hidden;margin-top:12px}
.mini-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s}
.panel{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.panel-head h3{margin:0;font-size:14px;font-weight:600}
.panel-head .range{font-size:11.5px;color:var(--text-tertiary)}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;margin-top:18px;padding-top:6px;border-top:1px dashed var(--border)}
.chart i{flex:1;background:linear-gradient(to top,color-mix(in srgb,var(--accent) 70%,transparent),var(--accent));border-radius:2px 2px 0 0;min-height:2px;transition:height .6s ease;position:relative}
.chart i:hover{filter:brightness(1.15)}
.ticks{display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--text-tertiary);font-family:"JetBrains Mono",monospace}
.seg{display:inline-flex;background:var(--bg-hover);border-radius:8px;padding:2px;gap:2px}
.seg button{height:26px;padding:0 12px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text-secondary);transition:background .18s ease,color .18s ease,box-shadow .18s ease}
.seg button.on{background:var(--bg-surface);color:var(--text-primary);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.12)}
html[data-theme="dark"] .seg button.on{background:var(--border-strong)}
/* ---------- files ---------- */
.files-layout{flex:1;display:flex;min-height:0}
.files-main{flex:1;display:flex;flex-direction:column;min-width:0}
.fbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);flex:none}
.crumb{display:flex;align-items:center;gap:2px;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text-secondary)}
.crumb span{padding:3px 6px;border-radius:5px;cursor:pointer}
.crumb span:hover{background:var(--bg-hover);color:var(--text-primary)}
.crumb .sep{color:var(--text-tertiary);padding:0;cursor:default}
.ftable{flex:1;overflow-y:auto;padding:6px 10px}
.frow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:12.5px;cursor:default}
.frow:hover{background:var(--bg-hover)}
.frow .nm{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.frow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .sz{width:90px;text-align:right;color:var(--text-secondary);font-family:"JetBrains Mono",monospace;font-size:11.5px}
.frow .md{width:130px;text-align:right;color:var(--text-tertiary);font-family:"JetBrains Mono",monospace;font-size:11.5px}
.frow.head{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-tertiary);font-weight:600;cursor:default}
.frow.head:hover{background:none}
.frow .rowmenu{opacity:0;transition:opacity .12s}
.frow:hover .rowmenu{opacity:1}
.frow.folder{cursor:pointer}
.transfers{width:320px;flex:none;border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.tr-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.tr-head h3{margin:0;font-size:14px;font-weight:600}
.tr-head .cnt{font-size:11.5px;color:var(--text-tertiary);font-weight:400;margin-left:7px}
.tr-list{flex:1;overflow-y:auto;padding:0 10px 10px}
.tr{padding:11px;border-radius:9px;border:1px solid var(--border);margin-bottom:8px}
.tr .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tr .fname{flex:1;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .pct{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--text-secondary)}
.tr .pbar{height:5px;border-radius:999px;background:var(--bg-hover);overflow:hidden}
.tr .pbar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s}
.tr.done .pbar i{background:var(--success)}
.tr.err .pbar i{background:var(--danger)}
.tr .bottom{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text-tertiary)}
/* ---------- workspace files panel ---------- */
.files-panel{height:250px;flex:none;display:flex;flex-direction:column;background:var(--bg-surface);border-top:1px solid var(--border)}
.fp-head{height:40px;flex:none;display:flex;align-items:center;gap:6px;padding:0 14px}
.fp-crumb{display:flex;align-items:center;gap:4px;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text-tertiary);margin-left:4px}
.fp-crumb .cur{color:var(--text-primary)}
.fp-crumb .cbsep{display:inline-flex;opacity:.65}
.fp-body{flex:1;overflow-y:auto}
.files-panel .frow{height:30px;padding:0 14px;border-radius:0}
.files-panel .frow .sz{width:90px;text-align:right}
.files-panel .frow .md{width:150px;text-align:right}
.files-panel .frow:hover{background:var(--bg-hover)}
.files-panel .frow.sel{background:var(--bg-selected)}
.files-panel .frow.head{height:28px;background:var(--bg-subtle)}
.files-panel .frow.head:hover{background:var(--bg-subtle)}
.fp-body{overscroll-behavior:contain;scrollbar-width:thin}
.code-modal{width:720px}
.code-meta{display:flex;align-items:center;gap:14px;padding:10px 22px;font-size:11.5px;color:var(--text-tertiary);font-family:"JetBrains Mono",monospace;border-bottom:1px solid var(--border);flex-wrap:wrap}
.code-meta .sep-dot{width:3px;height:3px;border-radius:50%;background:var(--text-tertiary)}
.code-view{max-height:420px;overflow:auto;background:var(--terminal-bg);border:1px solid var(--border);border-radius:9px;padding:8px 0;font-family:"JetBrains Mono",monospace;font-size:12.5px;line-height:1.7;color:var(--terminal-text)}
.cd-line{display:flex;gap:14px;padding:0 14px}
.cd-line:hover{background:var(--bg-hover)}
.cd-n{width:30px;flex:none;text-align:right;color:var(--text-tertiary);user-select:none}
.cd-t{white-space:pre;color:var(--terminal-text)}
.cd-empty{padding:34px;text-align:center;color:var(--text-tertiary);font-size:12.5px}
.code-edit{width:100%;height:420px;resize:vertical;background:var(--terminal-bg);border:1px solid var(--border);border-radius:9px;padding:12px 14px;font-family:"JetBrains Mono",monospace;font-size:12.5px;line-height:1.7;color:var(--terminal-text);outline:none;white-space:pre;overflow:auto;transition:border-color .15s ease}
.code-edit:focus{border-color:var(--accent)}
.m-head-inline{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.m-head-inline .ic{color:var(--accent)}
/* ---------- status bar transfers ---------- */
.statusbar .tr-msg{display:flex;align-items:center;gap:5px;color:var(--text-secondary)}
.statusbar .tr-track{display:block;width:90px;height:4px;border-radius:999px;background:var(--bg-hover);overflow:hidden}
.statusbar .tr-track i{display:block;height:100%;background:var(--info);border-radius:999px;transition:width .4s ease}
.statusbar .tr-view{color:var(--accent);cursor:pointer}
.statusbar .tr-view:hover{text-decoration:underline}
/* ---------- settings ---------- */
.settings{flex:1;display:flex;min-height:0}
.set-nav{width:200px;flex:none;padding:16px 10px;border-right:1px solid var(--border)}
.set-nav .item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--text-secondary);cursor:pointer;margin-bottom:2px}
.set-nav .item:hover{background:var(--bg-hover);color:var(--text-primary)}
.set-nav .item.on{background:var(--bg-selected);color:var(--accent);font-weight:600}
.set-main{flex:1;overflow-y:auto;padding:24px 28px}
.set-main h1{margin:0 0 6px;font-size:19px;font-weight:600}
.set-main .lead{font-size:13px;color:var(--text-secondary);margin:0 0 26px;line-height:1.6;max-width:520px}
.set-block{margin-bottom:28px;max-width:620px}
.set-block h4{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-tertiary)}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);gap:20px}
.set-row:last-child{border-bottom:none}
.set-row .lbl{font-size:13px;font-weight:500}
.set-row .desc{font-size:11.5px;color:var(--text-tertiary);margin-top:3px}
.set-note{font-size:12px;color:var(--text-tertiary);margin-top:14px;line-height:1.6}
.switch{width:40px;height:23px;border-radius:999px;background:var(--border-strong);position:relative;flex:none;transition:background .18s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(17px)}
.radio-card{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--border);border-radius:9px;cursor:pointer;margin-bottom:8px;transition:border-color .15s,background .15s}
.radio-card:hover{background:var(--bg-hover)}
.radio-card.on{border-color:var(--accent);background:var(--accent-soft)}
.radio-card .r{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);flex:none;display:grid;place-items:center}
.radio-card.on .r{border-color:var(--accent)}
.radio-card.on .r::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.radio-card .ti{font-size:13px;font-weight:500}
.radio-card .ts{font-size:11.5px;color:var(--text-tertiary);margin-top:2px}
/* ---------- statusbar ---------- */
.statusbar{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--bg-subtle);border-top:1px solid var(--border);font-size:11px;color:var(--text-tertiary);font-family:"JetBrains Mono",monospace}
.statusbar .dim{display:flex;align-items:center;gap:14px}
.statusbar .dim span{display:flex;align-items:center;gap:5px}
/* ---------- modal ---------- */
.backdrop{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:80;padding:24px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:480px;max-width:100%;max-height:92vh;overflow-y:auto;background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);animation:pop .18s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.modal.wide{width:560px}
.m-head{padding:20px 22px 0}
.m-head h2{margin:0 0 6px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.m-head p{margin:0;font-size:12.5px;color:var(--text-secondary);line-height:1.55}
.m-body{padding:18px 22px}
.m-foot{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end}
.m-foot .left{margin-right:auto}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px}
.input{width:100%;height:38px;padding:0 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg-surface);outline:none;font-size:13px;transition:border-color .15s,box-shadow .15s}
.input.mono{font-family:"JetBrains Mono",monospace;font-size:12.5px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.input.err{border-color:var(--danger)}
.frow2{display:flex;gap:12px}
.frow2 .field{flex:1}
.errmsg{font-size:11.5px;color:var(--danger);margin-top:5px}
.checkrow{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:12.5px;color:var(--text-primary)}
.cbox{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s}
.cbox.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cbox.on svg{animation:checkPop .24s cubic-bezier(.2,.9,.3,1.35) both}
@keyframes checkPop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.hint{font-size:11.5px;color:var(--text-tertiary);margin-top:6px;line-height:1.5}
.adv{border-top:1px solid var(--border);margin-top:6px;padding-top:14px}
.adv-toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-secondary);cursor:pointer}
.adv-toggle:hover{color:var(--text-primary)}
.adv-toggle .chev{display:inline-flex;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.adv-toggle.open .chev{transform:rotate(90deg)}
.adv-body{max-height:0;opacity:0;transform:translateY(-5px);overflow:hidden;margin-top:0;transition:max-height .34s cubic-bezier(.4,0,.2,1),opacity .26s ease,transform .28s ease,margin-top .34s ease}
.adv-body.open{max-height:320px;opacity:1;transform:none;margin-top:14px}
.testbox-host{max-height:0;opacity:0;overflow:hidden;margin-top:0;transition:max-height .34s cubic-bezier(.4,0,.2,1),opacity .26s ease,margin-top .34s ease}
.testbox-host.show{max-height:140px;opacity:1;margin-top:14px}
.m-body.has-test{padding-bottom:0}
.testbox{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:10px 12px;border-radius:9px;margin:0;transform-origin:top;animation:dropIn .3s cubic-bezier(.2,.8,.3,1) both}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px) scaleY(.96)}to{opacity:1;transform:none}}
.cred-field.swap{animation:swapIn .28s ease}
@keyframes swapIn{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}
.card,.panel,.input,.seg,.switch,.radio-card,.set-row,.frow,.tr,.tab,.modal,.toolbar,.sidebar,.statusbar,.quickmon{transition:background-color .25s ease,border-color .25s ease,color .25s ease}
.testbox.ok{background:var(--success-soft);color:var(--success)}
.testbox.bad{background:var(--danger-soft);color:var(--danger)}
.testbox.run{background:var(--bg-hover);color:var(--text-secondary)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kv{background:var(--bg-subtle);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:14px}
.kv .r{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:12px}
.kv .r .k{color:var(--text-secondary)}
.kv .r .v{font-family:"JetBrains Mono",monospace;word-break:break-all;text-align:right}
.warnbox{background:var(--warning-soft);color:var(--warning);border-radius:9px;padding:11px 13px;font-size:12px;line-height:1.55;margin-bottom:14px;display:flex;gap:9px}
.dangerbox{background:var(--danger-soft);border-radius:9px;padding:14px;font-size:12.5px;line-height:1.6;color:var(--text-primary);margin-bottom:14px}
.causelist{list-style:none;margin:10px 0 0;padding:0}
.causelist li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);padding:3px 0}
.causelist li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--text-tertiary);flex:none}
details.snippet{margin-top:12px;border:1px solid var(--border);border-radius:9px;overflow:hidden}
details.snippet summary{padding:9px 12px;font-size:12px;color:var(--text-secondary);cursor:pointer;list-style:none}
details.snippet .code{padding:11px 13px;background:var(--terminal-bg);font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--terminal-text);border-top:1px solid var(--border);white-space:pre-wrap}
.link{color:var(--accent);cursor:pointer}
.link:hover{text-decoration:underline}
/* ---------- palette ---------- */
.palette-wrap{align-items:flex-start;padding-top:12vh}
.palette{width:560px;max-width:100%;background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:pop .16s}
.palette input{width:100%;height:50px;border:none;border-bottom:1px solid var(--border);background:none;outline:none;padding:0 18px;font-size:14px;color:var(--text-primary)}
.palette input::placeholder{color:var(--text-tertiary)}
.p-list{max-height:340px;overflow-y:auto;padding:8px}
.p-sec{padding:9px 12px 5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-tertiary);font-weight:600}
.p-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13px}
.p-item.on{background:var(--accent-soft);color:var(--accent)}
.p-item .pi-ic{color:var(--text-tertiary)}
.p-item.on .pi-ic{color:var(--accent)}
.p-item .pi-sub{margin-left:auto;font-size:11px;color:var(--text-tertiary);font-family:"JetBrains Mono",monospace}
/* ---------- toast ---------- */
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:90}
.toast{display:flex;align-items:center;gap:11px;min-width:280px;padding:12px 14px;border-radius:11px;background:var(--bg-elevated);border:1px solid var(--border);box-shadow:var(--shadow);font-size:12.5px;animation:slidein .22s cubic-bezier(.2,.8,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}}
.toast .t-ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.toast .t-ic.ok{background:var(--success-soft);color:var(--success)}
.toast .t-ic.info{background:var(--accent-soft);color:var(--accent)}
.toast .t-ic.bad{background:var(--danger-soft);color:var(--danger)}
.toast .t-act{margin-left:auto;color:var(--accent);font-weight:600;cursor:pointer}
/* ---------- context menu ---------- */
.ctx{position:fixed;z-index:100;min-width:184px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:5px;animation:pop .12s}
.ctx .ci{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;font-size:12.5px;cursor:pointer;color:var(--text-primary)}
.ctx .ci:hover{background:var(--bg-hover)}
.ctx .ci.danger{color:var(--danger)}
.ctx .sep{height:1px;background:var(--border);margin:5px 4px}
@media (max-width:1180px){.cards{grid-template-columns:repeat(2,1fr)}}
</style>

function tickMetrics(){
 metrics.cpu=Math.max(4,Math.min(92,metrics.cpu+(Math.random()*16-8)));
 metrics.mem=Math.max(2,Math.min(15,metrics.mem+(Math.random()*.7-.35)));
 metrics.down=Math.max(.1,metrics.down+(Math.random()*1.2-.6));
 metrics.up=Math.max(20,metrics.up+(Math.random()*160-80));
 metrics.load=[metrics.load[0]+(Math.random()*.2-.1),metrics.load[1],metrics.load[2]].map(v=>Math.max(.05,v));
 metrics.hist=metrics.hist.slice(1).concat([Math.max(3,Math.min(96,metrics.cpu+Math.random()*22-11))]);
 metrics.ago=0;
}

function startTransferTimer(){
 if(state.transferTimer)clearInterval(state.transferTimer);
 state.transferTimer=setInterval(()=>{
  let dirty=false;
  state.transfers.forEach(tr=>{
   if(tr.status==="uploading"&&tr.pct<100){
    tr.pct=Math.min(100,tr.pct+Math.random()*4+1.5);
    if(tr.pct>=100){tr.pct=100;tr.status="done";toast("ok",t("toastUpload"),"check");}
    dirty=true;
   }
  });
  if(dirty){paintQuick();renderTransfers();renderStatus();}
 },700);
}

function connect(id,opts){
 opts=opts||{};
 const s=server(id);if(!s)return;
 if(s.changed&&!opts.forceChanged){state.modal={type:"changed",id:id};render();return;}
 if(!s.known){state.modal={type:"hostkey",id:id,next:opts};render();return;}
 if(s.auth==="password"&&!s.creds&&!opts.credDone){state.modal={type:"cred",id:id,next:opts};render();return;}
 state.selected=id;s.status="connecting";render();
 setTimeout(()=>{
  const s2=server(id);if(!s2||s2.status!=="connecting")return;
  s2.status="connected";
  const tab=activeTab();tab.lines=baseTerm();
  if(state.view!=="workspace"&&state.view!=="monitor"&&state.view!=="files")state.view="workspace";
  render();toast("ok",t("toastConnected",{name:s2.name}),"check");startTransferTimer();

}

}

 const arr=(p.view==="thread"?THREADS:PROCESSES).slice();
 arr.sort(function(a,b){return p.order==="desc"?b[key]-a[key]:a[key]-b[key];});

function fmtMetric(k,v){
 if(k==="cpu")return (Math.round(v*10)/10)+"%";
 if(k==="mem")return v>=1024?(Math.round(v/102.4)/10)+" GB":Math.round(v)+" MB";
 if(k==="disk")return v>=1024?(Math.round(v/102.4)/10)+" GB":(v<1?v.toFixed(1):Math.round(v))+" MB";

}

function testboxHtml(f){if(!f.test)return "";return '<div class="testbox '+f.test+'">'+(f.test==="run"?'<span class="spin"></span>'+t("testing"):f.test==="ok"?'<span>'+icon("check",15)+'</span>'+t("testOk",{ms:f.testMs||18}):'<span>'+icon("alert",15)+'</span>'+t("testFail"))+'</div>';}
function toggleCheckbox(rowEl){const b=rowEl.querySelector(".cbox");if(!b)return;const on=b.classList.toggle("on");b.innerHTML=on?icon("check",12):"";}

/* ---------------- palette ---------------- */
function paletteItems(){
 const q=state.palette.q.trim().toLowerCase();const out=[];
 state.servers.forEach(s=>out.push({sec:t("pServers"),label:s.name,sub:s.host,ic:"server",act:"palette:server",id:s.id}));
 out.push({sec:t("pNavigate"),label:t("viewWorkspace"),sub:"",ic:"terminal",act:"nav",view:"workspace"});
 out.push({sec:t("pNavigate"),label:t("viewMonitor"),sub:"",ic:"activity",act:"nav",view:"monitor"});
 out.push({sec:t("pNavigate"),label:t("viewFiles"),sub:"",ic:"folder",act:"nav",view:"files"});
 out.push({sec:t("pActions"),label:t("addAction"),sub:"",ic:"plus",act:"add:open"});
 out.push({sec:t("pActions"),label:t("toggleTheme"),sub:"",ic:"moon",act:"palette:theme"});
 out.push({sec:t("pActions"),label:t("switchLang"),sub:"",ic:"globe",act:"palette:lang"});
 out.push({sec:t("pActions"),label:t("clearTransfers"),sub:"",ic:"trash",act:"palette:clear"});
 return out.filter(x=>!q||x.label.toLowerCase().includes(q)||x.sub.toLowerCase().includes(q));
}
function paletteHtml(){
 const items=paletteItems();
 let h='';let sec="";let realIdx=-1;
 items.forEach((it,i)=>{if(it.sec!==sec){sec=it.sec;h+='<div class="p-sec">'+sec+'</div>';}
  const on=i===state.palette.idx?' on':'';
  h+='<div class="p-item'+on+'" data-act="'+it.act+'" data-view="'+(it.view||"")+'" data-id="'+(it.id||"")+'" data-i="'+i+'">'+'<span class="pi-ic">'+icon(it.ic,15)+'</span>'+esc(it.label)+(it.sub?'<span class="pi-sub">'+esc(it.sub)+'</span>':'')+'</div>';
 });
 if(!items.length)h='<div style="padding:26px;text-align:center;color:var(--text-tertiary);font-size:12.5px">'+t("noResults")+'</div>';
 return '<div class="backdrop palette-wrap" data-act="palette:close">'+'<div class="palette" data-stop><input id="paletteInput" placeholder="'+t("palettePh")+'" /><div class="p-list">'+h+'</div></div></div>';
}

function paintCtx(){let layer=document.getElementById("ctxLayer");if(!state.ctx){if(layer)layer.remove();return;}if(!layer){layer=document.createElement("div");layer.id="ctxLayer";document.body.appendChild(layer);}layer.innerHTML=ctxHtml();}

function closeCtx(){state.ctx=null;paintCtx();}
function closePalette(){state.palette.open=false;}
function closeModalAndNavigate(id){state.modal=null;connect(id,{credDone:true});}
document.addEventListener("contextmenu",e=>{
 const srv=e.target.closest("[data-act='server:select']");
 if(srv){e.preventDefault();state.ctx={kind:"server",id:srv.dataset.id,x:e.clientX,y:e.clientY};paintCtx();return;}
 const wf=e.target.closest(".files-panel .frow[data-act='wpfile:row']");
 if(wf){e.preventDefault();state.ctx={kind:"wpfile",i:+wf.dataset.i,x:e.clientX,y:e.clientY};paintCtx();return;}
 const ff=e.target.closest(".ftable .frow[data-act='file:row']");
 if(ff){e.preventDefault();state.ctx={kind:"file",i:+ff.dataset.i,x:e.clientX,y:e.clientY};paintCtx();return;}
});
document.addEventListener("dblclick",e=>{
 const wf=e.target.closest(".files-panel .frow[data-act='wpfile:row']");
 if(wf){const f=wsEntries()[+wf.dataset.i];if(!f)return;
  if(f.type==="folder"){state.wsPath=(state.wsPath==="/"?"":state.wsPath)+"/"+f.n;render();}
  else{state.ctx=null;state.modal={type:"fileview",file:f,dir:state.wsPath};render();}
  return;}
 const ff=e.target.closest(".ftable .frow[data-act='file:row']");
 if(ff){const f=state.files[+ff.dataset.i];if(f&&f.type==="file"){state.ctx=null;state.modal={type:"fileview",file:f,dir:state.path.join("/").replace("//","/")};render();}return;}
});
document.addEventListener("input",e=>{
 if(e.target.id==="sideFilter"){state.filter=e.target.value;const v=e.target.value;render();const i=document.getElementById("sideFilter");if(i){i.focus();i.value=v;}return;}
 if(e.target.id==="paletteInput"){state.palette.q=e.target.value;state.palette.idx=0;render();return;}
 const f=e.target.dataset.f;if(f&&state.modal){state.modal[f]=e.target.value;}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){if(state.palette.open){closePalette();render();}else if(state.modal){state.modal=null;render();}else if(state.ctx){state.ctx=null;paintCtx();}return;}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();state.palette.open=!state.palette.open;state.palette.q="";state.palette.idx=0;render();return;}
 if(state.palette.open){
  const items=paletteItems();
  if(e.key==="ArrowDown"){e.preventDefault();state.palette.idx=Math.min(items.length-1,state.palette.idx+1);render();}
  else if(e.key==="ArrowUp"){e.preventDefault();state.palette.idx=Math.max(0,state.palette.idx-1);render();}
  else if(e.key==="Enter"){e.preventDefault();const it=items[state.palette.idx];if(it){const fake={dataset:{act:it.act,view:it.view||"",id:it.id||""}};const ev=new MouseEvent("click");Object.defineProperty(ev,"target",{value:{closest:()=>({dataset:fake.dataset})}});/* simulate */ dispatchPalette(it);} }
  return;
 }
 if(state.modal&&state.modal.type==="add"&&e.key==="Enter"&&e.target.dataset&&e.target.dataset.f){e.preventDefault();submitAdd();return;}
});
function dispatchPalette(it){
 if(it.act==="palette:server"){const s=server(it.id);closePalette();state.selected=it.id;if(s.status!=="connected"&&s.status!=="connecting")connect(it.id);else state.view="workspace";render();}
 else if(it.act==="nav"){closePalette();state.view=it.view;render();}
 else if(it.act==="add:open"){closePalette();state.modal={type:"add",name:"",host:"192.168.1.10",port:22,user:"root",auth:"password",adv:false,test:null};render();}
 else if(it.act==="palette:theme"){state.theme=themeNow()==="dark"?"light":"dark";savePrefs();closePalette();applyTheme();render();}
 else if(it.act==="palette:lang"){state.lang=state.lang==="zh"?"en":"zh";savePrefs();closePalette();applyTheme();render();}
 else if(it.act==="palette:clear"){state.transfers=state.transfers.filter(x=>x.status==="uploading");closePalette();toast("info",t("toastCleared"),"trash");render();}
}
if(window.matchMedia)window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(state.theme==="system")applyTheme();});

/* focus modal input */
const origRender=render;
render=function(){origRender();postRender();};
function postRender(){
 bindTerminalInput();
 const ci=document.getElementById("credInput");if(ci)ci.focus();
}
function bindTerminalInput(){
 const focusMode=state.modal&&state.modal.type==="focus";
 if(state.view!=="workspace"&&!focusMode)return;
 if(!focusMode&&(state.modal||state.palette.open))return;
 const ti=document.getElementById(focusMode?"focusTermInput":"termInput");
 if(!ti)return;
 ti.focus();
 ti.addEventListener("keydown",e=>{if(e.key==="Enter"){const v=ti.value;ti.value="";runCommand(v);}e.stopPropagation();});
 const sc=document.getElementById(focusMode?"termScrollFocus":"termScroll");if(sc)sc.scrollTop=sc.scrollHeight;
}
/* sparkline painting */
function paintQuick(){
 document.querySelectorAll("[data-spark='cpu']").forEach(el=>{let h='';for(let i=0;i<12;i++){const v=Math.max(8,Math.min(100,metrics.cpu+(i-6)*4+Math.random()*14-7));h+='<i style="height:'+v+'%"></i>';}el.innerHTML=h;});
 document.querySelectorAll("[data-spark='mem']").forEach(el=>{let h='';for(let i=0;i<12;i++){const v=Math.max(10,Math.min(100,metrics.mem/16*100+(Math.random()*24-12)));h+='<i style="height:'+v+'%"></i>';}el.innerHTML=h;});
 document.querySelectorAll("[data-spark='net']").forEach(el=>{let h='';for(let i=0;i<12;i++){const v=Math.max(8,Math.min(100,metrics.down*24+Math.random()*24-12));h+='<i style="height:'+v+'%"></i>';}el.innerHTML=h;});
 document.querySelectorAll("[data-spark='up']").forEach(el=>{let h='';for(let i=0;i<12;i++){const v=Math.max(8,Math.min(100,metrics.up/7+Math.random()*26-13));h+='<i style="height:'+v+'%"></i>';}el.innerHTML=h;});
}
setInterval(paintQuick,2500);
paintQuick();

/* focus modal (terminal focus) */
const _modalHtml=modalHtml;
modalHtml=function(){
 if(state.modal&&state.modal.type==="focus"){
  const s=server(state.modal.id);const tab=state.terminal.tabs.find(x=>x.id===state.terminal.active)||state.terminal.tabs[0];
  if(!tab.lines)tab.lines=baseTerm();
  let lines=tab.lines.map(l=>'<div class="ln '+(l.c||"")+'">'+esc(l.raw!==undefined?l.raw:l.x)+'</div>').join("");
  const inlineF=state.settings.terminalInput==="inline";
  const finp='<input id="focusTermInput" autocomplete="off" spellcheck="false" />';
  const fterm=inlineF?'<div class="term" style="font-size:13px" id="termScrollFocus">'+lines+'<div class="ln tp-line">'+termPromptParts(s)+finp+'</div></div>':'<div class="term" style="font-size:13px" id="termScrollFocus">'+lines+'</div><div class="term-input">'+termPromptParts(s)+finp+'<span class="cursor"></span></div>';
  return '<div class="backdrop" style="background:var(--bg-app);padding:0" data-stop><div style="position:absolute;inset:0;display:flex;flex-direction:column">'+
   '<div class="ws-head"><div class="host">'+icon("terminal",14)+'<b>'+esc(s.name)+'</b><span style="color:var(--text-tertiary)">'+esc(s.user)+'@'+esc(s.host)+'</span></div>'+pill(s.status)+'<div style="flex:1"></div>'+
   '<button class="btn ghost sm" data-act="modal:close">'+icon("shrink",14)+t("exitFocus")+'</button></div>'+
   '<div class="term-wrap">'+fterm+'</div>'+
   '<div class="statusbar" style="border-top:1px solid var(--border)"><div class="dim"><span>'+icon("terminal",12)+t("focus")+'</span></div><div class="dim"><span>80×24</span><span>UTF-8</span><span>zsh</span></div></div>'+
   '</div></div>';
 }
 return _modalHtml.apply(this,arguments);
};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* boot */
(function boot(){
 let hp;try{hp=new URLSearchParams((location.hash||"").replace(/^#/,""));}catch(e){hp=new URLSearchParams("");}
 if(hp.get("lang"))state.lang=hp.get("lang");
 if(hp.get("theme"))state.theme=hp.get("theme");
 if(hp.get("sec"))state.settingsSec=hp.get("sec");
 if(hp.get("term"))state.settings.terminalInput=hp.get("term");
 if(hp.get("noDemo")!=="1")seedDemo();
 if(hp.get("select"))state.selected=hp.get("select");
 if(hp.get("view"))state.view=hp.get("view");
 if(hp.get("select")){const s=server(state.selected);if(s){s.known=true;s.creds=s.auth!=="password";s.changed=false;s.status="connected";const tab=activeTab();if(!tab.lines)tab.lines=baseTerm();}}
 const md=hp.get("modal");
 if(md){const sid=state.selected||(state.servers[0]&&state.servers[0].id);state.modal={type:md,id:sid,name:"Production Web",host:"192.168.1.20",port:22,user:"root",auth:"password",adv:false,test:null};}
 if(hp.get("palette")==="1"){state.palette.open=true;}
 if(hp.get("addtest")&&state.modal&&state.modal.type==="add"){state.modal.test=hp.get("addtest");state.modal.testMs=33;}
 render();
 if(!state.modal&&state.selected&&server(state.selected)&&server(state.selected).status==="connected")startTransferTimer();
})();
</script>

name: Packaging Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Smoke / ${{ matrix.kind }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - kind: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
          - kind: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Test MSI version mapping
        run: node --test tools/msi-version.test.mjs
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.12.0 --locked

      - name: Generate Windows MSI override
        if: runner.os == 'Windows'
        shell: bash
        run: node tools/write-msi-config.mjs

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: '-'
          CI: 'true'
        run: |
          set -o pipefail
          cargo tauri build --target ${{ matrix.target }} --bundles dmg --ci -- --locked 2>&1 \
            | tee macos-bundle-build.log

      - name: Build Windows MSI
        if: runner.os == 'Windows'
        run: >-
          cargo tauri build
          --config src-tauri/tauri.release-windows.conf.json
          --target ${{ matrix.target }}
          --bundles msi
          --ci
          -- --locked

      - name: Inspect Windows MSI ProductVersion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $items = @(Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/msi" -Filter '*.msi' -File)
          if ($items.Count -ne 1) { throw "Expected one MSI, got $($items.Count)" }
          $expected = (Get-Content 'src-tauri/tauri.release-windows.conf.json' -Raw | ConvertFrom-Json).bundle.windows.wix.version
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($items[0].FullName, 0)
          $view = $database.OpenView("SELECT Value FROM Property WHERE Property = 'ProductVersion'")
          $view.Execute()
          $record = $view.Fetch()
          if ($null -eq $record) { throw 'MSI ProductVersion not found' }
          $actual = $record.StringData(1)
          $view.Close()
          if ($actual -ne $expected) { throw "MSI version mismatch: $actual != $expected" }
          Write-Host "MSI ProductVersion verified: $actual"

      - name: Inspect macOS DMG, architecture and ad-hoc signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("target/${{ matrix.target }}/release/bundle/dmg"/*.dmg)
          test "${#files[@]}" -eq 1
          dmg="${files[0]}"
          hdiutil verify "$dmg"
          mount_dir="$(mktemp -d)"
          mounted=0
          cleanup() {
            if [ "$mounted" -eq 1 ]; then hdiutil detach -quiet "$mount_dir" || true; fi
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -quiet -mountpoint "$mount_dir" "$dmg"
          mounted=1
          app="$mount_dir/MauLink.app"
          binary="$app/Contents/MacOS/maulink"
          test -f "$binary"
          case '${{ matrix.target }}' in
            aarch64-apple-darwin) expected_arch=arm64 ;;
            x86_64-apple-darwin) expected_arch=x86_64 ;;
            *) echo 'Unexpected macOS target' >&2; exit 1 ;;
          esac
          lipo -archs "$binary" | tr ' ' '\n' | grep -Fx "$expected_arch"
          codesign --verify --deep --strict "$app"
          identifier=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          test "$identifier" = 'io.maulink.desktop'

      - name: Copy exactly one installer to smoke output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          source_dir="target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}"
          files=("$source_dir"/*.${{ matrix.bundle }})
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one ${{ matrix.bundle }}, got ${#files[@]}" >&2
            exit 1
          fi
          version=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json')).version")
          mkdir -p smoke-out
          cp "${files[0]}" "smoke-out/MauLink_smoke_${version}_${{ matrix.target }}.${{ matrix.bundle }}"

      - uses: actions/upload-artifact@v7
        with:
          name: maulink-smoke-${{ matrix.kind }}-${{ github.sha }}
          path: smoke-out/*
          if-no-files-found: error
          retention-days: 7

      - name: Collect macOS failure evidence
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          mkdir -p smoke-diagnostics
          test -f macos-bundle-build.log && cp macos-bundle-build.log smoke-diagnostics/build.log
          sw_vers > smoke-diagnostics/runner.txt 2>&1
          df -h >> smoke-diagnostics/runner.txt 2>&1
          hdiutil info >> smoke-diagnostics/runner.txt 2>&1
          ls -la "target/${{ matrix.target }}/release/bundle/dmg" >> smoke-diagnostics/runner.txt 2>&1
          script="target/${{ matrix.target }}/release/bundle/dmg/bundle_dmg.sh"
          if [ -f "$script" ]; then cp "$script" smoke-diagnostics/bundle_dmg.sh; fi

      - uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'macOS'
        with:
          name: maulink-smoke-diagnostics-${{ matrix.kind }}-${{ github.sha }}
          path: smoke-diagnostics/*
          if-no-files-found: warn
          retention-days: 3

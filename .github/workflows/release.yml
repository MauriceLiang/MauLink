name: Build and Publish Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Detect version release
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect a new application version
        id: plan
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "Cannot determine the previous main commit" >&2
            exit 1
          fi

          version=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json')).version")
          tag="v${version}"
          node tools/check-release-version.mjs "$tag"

          previous_version=$(git show "$BEFORE_SHA:src-tauri/tauri.conf.json" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => process.stdout.write(JSON.parse(input).version))')
          if [[ "$previous_version" == "$version" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Application version unchanged; skipping release."
            exit 0
          fi

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_sha=$(git rev-parse "${tag}^{commit}")
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Release tag $tag already points to a different commit; increment the application version." >&2
              exit 1
            fi

            if release_is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null) && [[ "$release_is_draft" == "false" ]]; then
              echo "Release $tag is already published; skipping duplicate publication."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Manifest and tag versions must agree
        run: node tools/check-release-version.mjs "${{ needs.plan.outputs.tag }}"
      - name: Frontend checks
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run type-check
          npm --prefix frontend run test
          npm --prefix frontend run build
          node --test tools/check-release-version.test.mjs
          node --test tools/msi-version.test.mjs
          node --test frontend/visual/capture.test.mjs
          node frontend/visual/verify.mjs
      - name: Rust format and core tests
        run: |
          cargo fmt --all -- --check
          cargo test -p maulink-core --locked

  build:
    name: Package / ${{ matrix.kind }}
    needs: [plan, validate]
    if: needs.plan.outputs.should_release == 'true' && needs.validate.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - kind: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
          - kind: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.12.0 --locked
      - name: Build ad-hoc signed-for-testing macOS DMG
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: cargo tauri build --target ${{ matrix.target }} --bundles dmg --ci -- --locked
      - name: Generate Windows MSI version override
        if: runner.os == 'Windows'
        shell: bash
        run: node tools/write-msi-config.mjs "${{ needs.plan.outputs.tag }}"
      - name: Build Windows MSI
        if: runner.os == 'Windows'
        run: >-
          cargo tauri build
          --config src-tauri/tauri.release-windows.conf.json
          --target ${{ matrix.target }}
          --bundles msi
          --ci
          -- --locked
      - name: Verify Windows GUI executable subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/check-windows-gui-subsystem.ps1 `
            -Path "target/${{ matrix.target }}/release/maulink.exe"
      - name: Verify MSI ProductVersion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msis = @(Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/msi" -Filter '*.msi' -File)
          if ($msis.Count -ne 1) { throw "Expected one MSI, got $($msis.Count)" }
          $expected = (Get-Content 'src-tauri/tauri.release-windows.conf.json' -Raw | ConvertFrom-Json).bundle.windows.wix.version
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msis[0].FullName, 0)
          $view = $database.OpenView("SELECT Value FROM Property WHERE Property = 'ProductVersion'")
          $view.Execute()
          $record = $view.Fetch()
          if ($null -eq $record) { throw 'MSI ProductVersion missing' }
          $actual = $record.StringData(1)
          $view.Close()
          if ($actual -ne $expected) { throw "MSI ProductVersion mismatch: actual=$actual expected=$expected" }
          "MSI ProductVersion verified: $actual" | Write-Host
      - name: Collect and rename one expected installer
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          source_dir="target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}"
          files=("$source_dir"/*.${{ matrix.bundle }})
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one ${{ matrix.bundle }} under $source_dir, got ${#files[@]}"
            exit 1
          fi
          mkdir -p release-out
          cp "${files[0]}" "release-out/MauLink_${{ needs.plan.outputs.version }}_${{ matrix.target }}.${{ matrix.bundle }}"
      - uses: actions/upload-artifact@v7
        with:
          name: maulink-${{ matrix.kind }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [plan, build]
    if: needs.plan.outputs.should_release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: maulink-*
          path: release-dist
          merge-multiple: true
      - name: Ensure exact expected release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-dist/*)
          if [ "${#files[@]}" -ne 3 ]; then
            echo "Expected 3 installers, got ${#files[@]}"
            exit 1
          fi
          test -f "release-dist/MauLink_${{ needs.plan.outputs.version }}_aarch64-apple-darwin.dmg"
          test -f "release-dist/MauLink_${{ needs.plan.outputs.version }}_x86_64-apple-darwin.dmg"
          test -f "release-dist/MauLink_${{ needs.plan.outputs.version }}_x86_64-pc-windows-msvc.msi"
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-dist
          sha256sum -- *.dmg *.msi > SHA256SUMS
      - name: Create or complete release automatically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if release_is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$release_is_draft" == "false" ]]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" release-dist/* --clobber
          else
            release_flags=(--draft --target "$GITHUB_SHA" --title "MauLink ${RELEASE_TAG}" \
              --notes "Cross-platform MauLink release packages. macOS builds are ad-hoc signed and NOT notarized; Windows MSI is not Authenticode signed.")
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${release_flags[@]}" release-dist/*
          fi
          gh release edit "$RELEASE_TAG" --draft=false

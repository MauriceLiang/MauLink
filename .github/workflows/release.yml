name: Build and Publish Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Detect version release
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect a new application version
        id: plan
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "Cannot determine the previous main commit" >&2
            exit 1
          fi

          version=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json')).version")
          tag="v${version}"
          node tools/check-release-version.mjs "$tag"

          previous_version=$(git show "$BEFORE_SHA:src-tauri/tauri.conf.json" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => process.stdout.write(JSON.parse(input).version))')
          if [[ "$previous_version" == "$version" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Application version unchanged; skipping release."
            exit 0
          fi

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_sha=$(git rev-parse "${tag}^{commit}")
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Release tag $tag already points to a different commit; increment the application version." >&2
              exit 1
            fi

            if release_is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null) && [[ "$release_is_draft" == "false" ]]; then
              echo "Release $tag is already published; skipping duplicate publication."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Manifest and tag versions must agree
        run: node tools/check-release-version.mjs "${{ needs.plan.outputs.tag }}"
      - name: Frontend checks
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run type-check
          npm --prefix frontend run test
          npm --prefix frontend run build
          node --test tools/check-release-version.test.mjs
          node --test tools/msi-version.test.mjs
          node --test tools/write-updater-config.test.mjs tools/build-update-index.test.mjs
          node --test frontend/visual/capture.test.mjs
          node frontend/visual/verify.mjs
      - name: Rust format and core tests
        run: |
          cargo fmt --all -- --check
          cargo test -p maulink-core --locked

  verify-update-hosting:
    name: Verify GitHub Pages update host
    runs-on: ubuntu-24.04
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5

  build:
    name: Package / ${{ matrix.kind }}
    needs: [plan, validate, verify-update-hosting]
    if: needs.plan.outputs.should_release == 'true' && needs.validate.result == 'success' && needs.verify-update-hosting.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - kind: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
          - kind: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: msi
    runs-on: ${{ matrix.os }}
    environment: maulink-updater-release
    env:
      MAULINK_UPDATER_PUBLIC_KEY: ${{ vars.MAULINK_UPDATER_PUBLIC_KEY }}
      MAULINK_UPDATER_INDEX_BASE_URL: ${{ vars.MAULINK_UPDATER_INDEX_BASE_URL || 'https://mauriceliang.github.io/MauLink/updates/' }}
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.12.0 --locked
      - name: Require protected updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY in the maulink-updater-release Environment" >&2
            exit 1
          fi
          if [[ -z "${MAULINK_UPDATER_PUBLIC_KEY:-}" ]]; then
            echo "Missing repository variable MAULINK_UPDATER_PUBLIC_KEY" >&2
            exit 1
          fi
          node tools/write-updater-config.mjs src-tauri/tauri.release-updater.conf.json
      - name: Build macOS installer and updater archive
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          cargo tauri build
          --config src-tauri/tauri.release-updater.conf.json
          --target ${{ matrix.target }}
          --bundles app,dmg
          --ci
          -- --locked
      - name: Generate Windows MSI version override
        if: runner.os == 'Windows'
        shell: bash
        run: node tools/write-msi-config.mjs "${{ needs.plan.outputs.tag }}"
      - name: Build Windows MSI
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          cargo tauri build
          --config src-tauri/tauri.release-updater.conf.json
          --config src-tauri/tauri.release-windows.conf.json
          --target ${{ matrix.target }}
          --bundles msi
          --ci
          -- --locked
      - name: Verify Windows GUI executable subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/check-windows-gui-subsystem.ps1 `
            -Path "target/${{ matrix.target }}/release/maulink.exe"
      - name: Verify MSI ProductVersion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msis = @(Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/msi" -Filter '*.msi' -File)
          if ($msis.Count -ne 1) { throw "Expected one MSI, got $($msis.Count)" }
          $expected = (Get-Content 'src-tauri/tauri.release-windows.conf.json' -Raw | ConvertFrom-Json).bundle.windows.wix.version
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msis[0].FullName, 0)
          $view = $database.OpenView("SELECT Value FROM Property WHERE Property = 'ProductVersion'")
          $view.Execute()
          $record = $view.Fetch()
          if ($null -eq $record) { throw 'MSI ProductVersion missing' }
          $actual = $record.StringData(1)
          $view.Close()
          if ($actual -ne $expected) { throw "MSI ProductVersion mismatch: actual=$actual expected=$expected" }
          "MSI ProductVersion verified: $actual" | Write-Host
      - name: Collect and rename one expected installer
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-out
          version="${{ needs.plan.outputs.version }}"
          target="${{ matrix.target }}"
          if [[ "${{ matrix.bundle }}" == "dmg" ]]; then
            installer_dir="target/$target/release/bundle/dmg"
            installer_files=("$installer_dir"/*.dmg)
            updater_dir="target/$target/release/bundle/macos"
            updater_files=("$updater_dir"/*.app.tar.gz)
            if [[ "${#installer_files[@]}" -ne 1 || "${#updater_files[@]}" -ne 1 ]]; then
              echo "Expected one DMG and one .app.tar.gz for $target" >&2
              exit 1
            fi
            test -s "${updater_files[0]}.sig"
            cp "${installer_files[0]}" "release-out/MauLink_${version}_${target}.dmg"
            cp "${updater_files[0]}" "release-out/MauLink_${version}_${target}.app.tar.gz"
            cp "${updater_files[0]}.sig" "release-out/MauLink_${version}_${target}.app.tar.gz.sig"
          else
            installer_dir="target/$target/release/bundle/msi"
            installer_files=("$installer_dir"/*.msi)
            if [[ "${#installer_files[@]}" -ne 1 ]]; then
              echo "Expected one MSI for $target, got ${#installer_files[@]}" >&2
              exit 1
            fi
            test -s "${installer_files[0]}.sig"
            cp "${installer_files[0]}" "release-out/MauLink_${version}_${target}.msi"
            cp "${installer_files[0]}.sig" "release-out/MauLink_${version}_${target}.msi.sig"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: maulink-${{ matrix.kind }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [plan, build]
    if: needs.plan.outputs.should_release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MAULINK_UPDATER_PUBLIC_KEY: ${{ vars.MAULINK_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: maulink-*
          path: release-dist
          merge-multiple: true
      - name: Ensure exact expected release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-dist/*)
          if [ "${#files[@]}" -ne 8 ]; then
            echo "Expected 3 installers, 2 macOS updater bundles, and 3 signatures; got ${#files[@]} files"
            exit 1
          fi
          test -f "release-dist/MauLink_${{ needs.plan.outputs.version }}_aarch64-apple-darwin.dmg"
          test -f "release-dist/MauLink_${{ needs.plan.outputs.version }}_x86_64-apple-darwin.dmg"
          test -f "release-dist/MauLink_${{ needs.plan.outputs.version }}_x86_64-pc-windows-msvc.msi"
          test -s "release-dist/MauLink_${{ needs.plan.outputs.version }}_aarch64-apple-darwin.app.tar.gz"
          test -s "release-dist/MauLink_${{ needs.plan.outputs.version }}_aarch64-apple-darwin.app.tar.gz.sig"
          test -s "release-dist/MauLink_${{ needs.plan.outputs.version }}_x86_64-apple-darwin.app.tar.gz"
          test -s "release-dist/MauLink_${{ needs.plan.outputs.version }}_x86_64-apple-darwin.app.tar.gz.sig"
          test -s "release-dist/MauLink_${{ needs.plan.outputs.version }}_x86_64-pc-windows-msvc.msi.sig"
      - name: Verify updater signatures before creating the Release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MAULINK_UPDATER_PUBLIC_KEY:-}" ]]; then
            echo "Missing repository variable MAULINK_UPDATER_PUBLIC_KEY" >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
          version="${{ needs.plan.outputs.version }}"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            asset="release-dist/MauLink_${version}_${target}.app.tar.gz"
            minisign -Vm "$asset" -x "$asset.sig" -P "$MAULINK_UPDATER_PUBLIC_KEY" -q
          done
          asset="release-dist/MauLink_${version}_x86_64-pc-windows-msvc.msi"
          minisign -Vm "$asset" -x "$asset.sig" -P "$MAULINK_UPDATER_PUBLIC_KEY" -q
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-dist
          sha256sum -- *.dmg *.msi *.tar.gz *.sig > SHA256SUMS
      - name: Create or complete release automatically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if release_is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$release_is_draft" == "false" ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace or repoint its assets."
              exit 1
            fi
          else
            release_flags=(--draft --target "$GITHUB_SHA" --title "MauLink ${RELEASE_TAG}" \
              --notes "Cross-platform MauLink release packages and Tauri updater artifacts. macOS builds are ad-hoc signed and NOT notarized; Windows MSI is not Authenticode signed.")
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${release_flags[@]}"
          fi

          existing_dir="$RUNNER_TEMP/existing-release-assets"
          mkdir -p "$existing_dir"
          while IFS= read -r asset; do
            name="$(basename "$asset")"
            if gh release view "$RELEASE_TAG" --json assets --jq ".assets[].name" | grep -Fqx -- "$name"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$existing_dir"
              if ! cmp -s "$asset" "$existing_dir/$name"; then
                echo "Release asset $name already exists with different bytes; refusing to overwrite it." >&2
                exit 1
              fi
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done < <(find release-dist -maxdepth 1 -type f -print | sort)

          expected_names=$(find release-dist -maxdepth 1 -type f -printf '%f\n' | sort)
          remote_names=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)
          if [[ "$remote_names" != "$expected_names" ]]; then
            echo "Published Release assets do not match the verified build output." >&2
            diff -u <(printf '%s\n' "$expected_names") <(printf '%s\n' "$remote_names") || true
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false

  deploy-update-index:
    name: Publish Stable or Preview index
    needs: [plan, publish-release]
    if: needs.plan.outputs.should_release == 'true' && needs.publish-release.result == 'success'
    concurrency:
      group: maulink-update-index
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MAULINK_UPDATER_PUBLIC_KEY: ${{ vars.MAULINK_UPDATER_PUBLIC_KEY }}
      MAULINK_UPDATER_INDEX_BASE_URL: ${{ vars.MAULINK_UPDATER_INDEX_BASE_URL || 'https://mauriceliang.github.io/MauLink/updates/' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: maulink-*
          path: release-dist
          merge-multiple: true
      - name: Verify public Release asset URLs
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.plan.outputs.version }}"
          tag="${{ needs.plan.outputs.tag }}"
          for asset in \
            "MauLink_${version}_aarch64-apple-darwin.app.tar.gz" \
            "MauLink_${version}_x86_64-apple-darwin.app.tar.gz" \
            "MauLink_${version}_x86_64-pc-windows-msvc.msi"; do
            curl --fail --silent --show-error --location --head \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${asset}" >/dev/null
          done
      - uses: actions/configure-pages@v5
      - name: Build channel index without moving it backwards
        run: |
          node tools/build-update-index.mjs \
            "${{ needs.plan.outputs.version }}" \
            "${{ needs.plan.outputs.tag }}" \
            release-dist \
            update-site/updates
          touch update-site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: update-site
      - name: Deploy update indexes
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed index bytes over HTTPS
        run: >-
          node tools/verify-update-index.mjs
          update-site/updates
          "$MAULINK_UPDATER_INDEX_BASE_URL"

[package]
name = "maulink-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "maulink_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "maulink"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
maulink-core = { path = "../crates/maulink-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.11.6", features = ["image-png", "protocol-asset"] }
tauri-plugin-dialog = "2.7"
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
image.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", default-features = false, features = ["alloc"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["LAContext", "LAError", "LAPublicDefines", "block2", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["std", "Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
